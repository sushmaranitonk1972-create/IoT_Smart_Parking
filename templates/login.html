<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Parking</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #111827,
                #2563eb
            );
        }

        .login-container {
            width: 400px;
            max-width: 92%;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;

            font-size: 50px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            color: #111827;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #374151;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;
        }

        .test-account {
            margin-top: 25px;

            padding: 15px;

            background: #f3f4f6;

            border-radius: 8px;

            font-size: 13px;

            color: #4b5563;

            line-height: 1.7;
        }

        .test-account strong {
            color: #111827;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #9ca3af;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🚗
    </div>


    <h1>
        Smart Parking
    </h1>


    <p class="subtitle">
        IoT Parking Management System
    </p>


    <!-- ERROR -->

    {% if error %}

    <div class="error">
        ⚠️ {{ error }}
    </div>

    {% endif %}


    <!-- LOGIN FORM -->

    <form action="/login" method="POST">


        <div class="form-group">

            <label for="email">
                📧 Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                🔒 Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            🔐 Login
        </button>


    </form>


    <!-- TEST ACCOUNT -->

    <div class="test-account">

        <strong>Test Account</strong>

        <br>

        Email:
        admin@smartparking.com

        <br>

        Password:
        admin123

        <br><br>

        Email:
        user@smartparking.com

        <br>

        Password:
        user123

    </div>


    <div class="footer">

        Smart Parking Management System © 2026

    </div>


</div>


</body>

</html>
